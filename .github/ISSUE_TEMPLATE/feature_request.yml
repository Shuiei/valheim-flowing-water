name: Feature request
description: Something the water could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The thing you are trying to make in your world, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of it, if you have one. A sketch or screenshot is welcome.
