# Signs each file of a GitHub release with Sigstore (keyless: the certificate names this workflow and
# this repository) and attaches the signature bundles to the release as <file>.sigstore.json.
# Runs when a release is published; run it by hand (Actions > Sign release) to sign an older release.
# How to check a download: SECURITY.md.
name: Sign release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v1.18.0)"
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      # Attach the bundles to the release.
      contents: write
      # Keyless signing: the workflow's identity token gets the Sigstore certificate.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the release files not signed yet
        run: |
          mkdir -p dist && cd dist
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in $assets; do
            case "$f" in *.sigstore.json) continue ;; esac
            if grep -qxF "$f.sigstore.json" <<< "$assets"; then
              echo "$f: already signed"
              continue
            fi
            gh release download "$TAG" --pattern "$f"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            gh release upload "$TAG" "$f.sigstore.json"
          done
