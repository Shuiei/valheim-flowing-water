# Update approved pull requests: each time main moves (a pull request merged), merges main into every
# open pull request that is approved and has auto-merge on, as the Update branch button does. Main
# requires branches to be up to date, so without this auto-merge waits for someone to click it.
# Drafts and pull requests already up to date are left alone; one that cannot be updated (a conflict,
# a fork) gets a warning in the run and is skipped.
# The merge is a new push: main's rules dismiss the approval it had (CodeRabbit's) and want the latest
# push approved, which CodeRabbit does not do for a merge of main alone. So the workflow asks it to
# approve again (@coderabbitai approve): the pull request was approved, and main's commits were reviewed
# when they were merged. A pull request's author cannot ask that (.coderabbit.yaml, allow_author_approval).
name: Update approved PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-approved-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # Merge main into the pull requests' branches.
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update the approved pull requests with auto-merge on
        run: |
          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefOid,isDraft,reviewDecision,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null and .reviewDecision == "APPROVED" and (.isDraft | not)) | "\(.number) \(.headRefOid)"')
          if [ -z "$prs" ]; then
            echo "No approved pull request with auto-merge on."
            exit 0
          fi
          while read -r pr sha; do
            # In an if: a failed call (rate limit, a fork's commit) skips this pull request, not the others.
            if ! behind=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .behind_by); then
              echo "::warning::#$pr could not be compared with main"
              continue
            fi
            if [ "$behind" = 0 ]; then
              echo "#$pr: up to date"
              continue
            fi
            # expected_head_sha: no update if someone pushed to the pull request meanwhile.
            if gh api -X PUT "repos/$GH_REPO/pulls/$pr/update-branch" -f expected_head_sha="$sha" --silent; then
              echo "#$pr: updated ($behind commits behind main)"
              # Its approval back: only main's reviewed commits were added. Asked once the merge commit is
              # the pull request's head (update-branch only starts it), else the approval would be the old
              # commit's and dismissed at once.
              head=$sha
              for _ in $(seq 30); do
                head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || head=$sha
                [ "$head" != "$sha" ] && break
                sleep 2
              done
              # The new head must be that merge: the old head and a commit of main as parents, nothing else.
              # A push by the author meanwhile would be a head without that review, not to approve.
              from_main=
              if [ "$head" != "$sha" ]; then
                parents=$(gh api "repos/$GH_REPO/commits/$head" --jq '[.parents[].sha] | join(" ")') || parents=
                read -r first second extra <<< "$parents"
                if [ "$first" = "$sha" ] && [ -n "$second" ] && [ -z "$extra" ]; then
                  from_main=$(gh api "repos/$GH_REPO/compare/$second...main" --jq '.status | test("^(identical|ahead)$")') || from_main=
                fi
              fi
              if [ "$head" = "$sha" ]; then
                echo "::warning::#$pr: the merge commit did not show within a minute; CodeRabbit was not asked to approve"
              elif [ "$from_main" != true ]; then
                echo "::warning::#$pr: its new head $head is not only main merged in; CodeRabbit was not asked to approve"
              elif ! gh pr comment "$pr" --body "@coderabbitai approve" > /dev/null; then
                echo "::warning::#$pr was updated but CodeRabbit could not be asked to approve it again"
              fi
            else
              echo "::warning::#$pr could not be updated (a conflict with main?)"
            fi
          done <<< "$prs"
